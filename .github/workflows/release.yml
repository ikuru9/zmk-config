name: Release ZMK Firmware

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Commit SHA to release; empty uses the workflow ref"
        required: false
        default: ""
        type: string

      build_run_id:
        description: "Successful Build ZMK firmware run ID"
        required: true
        type: string

      tag_name:
        description: "Optional explicit tag; empty uses today's date (YYYY-MM-DD), with -v0.0.N for same-day repeats"
        required: false
        default: ""
        type: string

      profile:
        description: "Optional build profile metadata (`stable`)"
        required: false
        default: ""
        type: string

  workflow_call:
    inputs:
      source_sha:
        description: "Commit SHA to release; empty uses the caller SHA"
        required: false
        default: ""
        type: string

      build_run_id:
        description: "Successful Build ZMK firmware run ID"
        required: true
        type: string

      tag_name:
        description: "Optional explicit tag; empty uses today's date (YYYY-MM-DD), with -v0.0.N for same-day repeats"
        required: false
        default: ""
        type: string

      profile:
        description: "Optional build profile metadata (`stable`)"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-zmk-firmware
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      profile: ${{ steps.meta.outputs.profile }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve release settings
        id: meta
        shell: bash
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          source_sha="$(git rev-parse HEAD)"
          tag="${INPUT_TAG_NAME:-}"

          #
          # Automatic version formats:
          #
          #   YYYY-MM-DD
          #   YYYY-MM-DD-v0.0.N  (same-day repeats)
          #
          if [ -z "${tag}" ]; then
            date_tag="$(date -u +%Y-%m-%d)"
            tag="${date_tag}"

            if git rev-parse \
              --verify \
              --quiet \
              "refs/tags/${tag}" \
              >/dev/null
            then
              build_number=1

              while git rev-parse \
                --verify \
                --quiet \
                "refs/tags/${date_tag}-v0.0.${build_number}" \
                >/dev/null
              do
                build_number=$((build_number + 1))
              done

              tag="${date_tag}-v0.0.${build_number}"
            fi
          fi

          if git rev-parse \
            --verify \
            --quiet \
            "refs/tags/${tag}" \
            >/dev/null
          then
            echo "::error::Tag '${tag}' already exists."
            exit 1
          fi

          profile="${INPUT_PROFILE:-stable}"

          case "${profile}" in
            stable)
              ;;
            *)
              echo "::error::Unsupported profile '${profile}'. Expected 'stable'."
              exit 1
              ;;
          esac

          if [[ "${tag}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(-v[0-9]+\.[0-9]+\.[0-9]+)?$ ]] || \
             [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          then
            prerelease=false
            make_latest=true
          else
            prerelease=true
            make_latest=false
          fi

          {
            echo "tag=${tag}"
            echo "source_sha=${source_sha}"
            echo "profile=${profile}"
            echo "prerelease=${prerelease}"
            echo "make_latest=${make_latest}"
          } >> "$GITHUB_OUTPUT"

          echo "Using release tag: ${tag}"
          echo "Using source SHA: ${source_sha}"
          echo "Using build profile: ${profile}"

  release:
    needs:
      - prepare

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: Download built firmware artifacts
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: ./artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Display downloaded file structure
        run: ls -R ./artifacts

      - name: Package firmware files into release assets
        id: package
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          mapfile -t firmware_files < <(
            find ./artifacts \
              -type f \
              \( \
                -name "*.uf2" \
                -o -name "*.bin" \
                -o -name "*.hex" \
              \) \
              | sort
          )

          if [ "${#firmware_files[@]}" -eq 0 ]; then
            echo "No firmware files (.uf2/.bin/.hex) found in artifacts."
            exit 1
          fi

          mkdir -p ./release-assets

          for file in "${firmware_files[@]}"; do
            cp "$file" "./release-assets/$(basename "$file")"
          done

          (
            cd ./release-assets

            : > SHA256SUMS

            for file in *.uf2 *.bin *.hex; do
              [ -f "$file" ] || continue
              sha256sum "$file" >> SHA256SUMS
            done

            sort -o SHA256SUMS SHA256SUMS
          )

          zip_file="zmk-firmware-${RELEASE_TAG}.zip"

          (
            cd ./release-assets

            assets=(./SHA256SUMS)

            for file in ./*.uf2 ./*.bin ./*.hex; do
              [ -f "$file" ] || continue
              assets+=("$file")
            done

            zip -9 "../${zip_file}" "${assets[@]}"
          )

          echo "zip_file=${zip_file}" >> "$GITHUB_OUTPUT"
          echo "sha_file=release-assets/SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ZMK_ACTIONS_TOKEN != '' && secrets.ZMK_ACTIONS_TOKEN || secrets.GITHUB_TOKEN }}

          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}

          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_MAKE_LATEST: ${{ needs.prepare.outputs.make_latest }}

          RELEASE_ZIP_FILE: ${{ steps.package.outputs.zip_file }}
          RELEASE_SHA_FILE: ${{ steps.package.outputs.sha_file }}

        run: |
          set -euo pipefail

          release_name="Firmware ${RELEASE_TAG}"

          release_body=$'Automated ZMK firmware release for `'"${RELEASE_TAG}"$'`.\nFirmware binaries are attached as release assets (`zmk-firmware-*.zip` and `SHA256SUMS`).\nGitHub auto-generates source code archives for every release; those links cannot be disabled.'

          payload="$(
            jq -n \
              --arg tag_name "${RELEASE_TAG}" \
              --arg target_commitish "${RELEASE_SOURCE_SHA}" \
              --arg name "${release_name}" \
              --arg body "${release_body}" \
              --arg make_latest "${RELEASE_MAKE_LATEST}" \
              --argjson prerelease "${RELEASE_PRERELEASE}" \
              '{
                tag_name: $tag_name,
                target_commitish: $target_commitish,
                name: $name,
                body: $body,
                prerelease: $prerelease,
                generate_release_notes: true,
                make_latest: $make_latest
              }'
          )"

          if release_json="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              2>/dev/null
          )"
          then
            release_id="$(jq -r '.id' <<<"${release_json}")"

            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --input - \
              <<<"${payload}" \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases" \
              --input - \
              <<<"${payload}" \
              >/dev/null
          fi

          gh release upload \
            "${RELEASE_TAG}" \
            "${RELEASE_ZIP_FILE}" \
            "${RELEASE_SHA_FILE}" \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
