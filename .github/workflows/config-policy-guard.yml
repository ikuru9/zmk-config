name: Config Policy Guard

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/config-policy-guard.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/draw-keymaps.yml"
      - ".github/workflows/release.yml"
      - "keymap-drawer/config.yaml"
      - "scripts/build_profiles.py"
      - "scripts/build_runner.py"
      - "scripts/ci/check_config_policy.sh"
      - "boards/**"
      - "config/**"
      - "snippets/**"
      - "build.yaml"
  pull_request:
    paths:
      - ".github/workflows/config-policy-guard.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/draw-keymaps.yml"
      - ".github/workflows/release.yml"
      - "keymap-drawer/config.yaml"
      - "scripts/build_profiles.py"
      - "scripts/build_runner.py"
      - "scripts/ci/check_config_policy.sh"
      - "boards/**"
      - "config/**"
      - "snippets/**"
      - "build.yaml"

permissions:
  contents: read

concurrency:
  group: config-policy-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-lint:
    name: Enforce Config Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run policy guard
        shell: bash
        run: bash scripts/ci/check_config_policy.sh

  random-sanity-selection:
    name: Select Random Sanity Targets
    needs: policy-lint
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.select.outputs.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: Select random firmware targets from build.yaml
        id: select
        run: |
          python3 scripts/build_runner.py select-matrix \
            --build-matrix-path build.yaml \
            --sample-count 2 \
            --github-output "$GITHUB_OUTPUT"

      - name: Show selected targets
        shell: bash
        run: |
          echo '${{ steps.select.outputs.build_matrix }}' | jq .

  random-firmware-sanity:
    name: Build Random Sanity Targets
    needs:
      - policy-lint
      - random-sanity-selection
    uses: ./.github/workflows/build.yml
    with:
      profile: "stable"
      build_matrix: ${{ needs.random-sanity-selection.outputs.build_matrix }}
      archive_name: guard-random-sanity

  queue-build:
    name: Queue Full Firmware Build
    needs: random-firmware-sanity

    # PR에서는 검증까지만 수행하고 실제 Release 체인은 시작하지 않음.
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        github.ref == format(
          'refs/heads/{0}',
          github.event.repository.default_branch
        )
      }}

    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: Trigger Build ZMK firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          echo "Source SHA: ${SOURCE_SHA}"

          gh workflow run build.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${DEFAULT_BRANCH}" \
            --raw-field "source_sha=${SOURCE_SHA}" \
            --raw-field "chain_next=true"