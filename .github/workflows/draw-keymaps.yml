name: Draw ZMK keymaps

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Commit SHA to render; empty uses the workflow ref"
        default: ""
        required: false
        type: string

      build_run_id:
        description: "Build workflow run ID containing the firmware artifact"
        default: ""
        required: false
        type: string

      chain_next:
        description: "Continue to Release after a successful draw"
        default: false
        required: false
        type: boolean

  workflow_call:
    inputs:
      source_sha:
        description: "Commit SHA to render; empty uses the caller SHA"
        default: ""
        required: false
        type: string

      build_run_id:
        description: "Build workflow run ID containing the firmware artifact"
        default: ""
        required: false
        type: string

      chain_next:
        description: "Continue to Release after a successful draw"
        default: false
        required: false
        type: boolean

concurrency:
  group: draw-keymaps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keymap-drawer:
    name: Generate keymap drawings
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Initialize ZMK workspace
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade west

          west init -l config
          west update --narrow

      - name: Check ZMK modules
        shell: bash
        run: |
          set -euo pipefail

          test -f modules/zmk/helpers/include/zmk-helpers/helper.h
          test -d modules/zmk/auto-layer/dts
          test -d modules/zmk/unicode/dts

          echo "ZMK modules available:"
          west list

      - name: Install keymap-drawer
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install keymap-drawer

      - name: Generate keymap drawings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p draw-artifacts

          shopt -s nullglob
          keymaps=(config/*.keymap)

          rendered=0

          if [ "${#keymaps[@]}" -eq 0 ]; then
            echo "No keymap files found in config/."
            exit 1
          fi

          for keymap_file in "${keymaps[@]}"; do
            keyboard="$(basename "${keymap_file}" .keymap)"
            yaml_out="draw-artifacts/${keyboard}.yaml"
            svg_out="draw-artifacts/${keyboard}.svg"
            layout_json=""

            # Scanner and shared base wrappers do not represent
            # a physical keyboard layout.
            if [ "${keyboard}" = "prospector_scanner" ] || \
               [ "${keyboard}" = "base" ]; then
              echo "Skipping non-physical keymap: ${keyboard}"
              continue
            fi

            if [ -f "config/${keyboard}.json" ]; then
              layout_json="config/${keyboard}.json"
            elif [ -f "boards/shields/${keyboard}/${keyboard}.json" ]; then
              layout_json="boards/shields/${keyboard}/${keyboard}.json"
            elif grep -q 'continuum/matrix/34.h' "${keymap_file}" && \
                 [ -f "config/delta_omega.json" ]; then
              # Reuse shared 34-key layout for continuum 34-key wrappers.
              layout_json="config/delta_omega.json"
            fi

            keymap \
              -c keymap-drawer/config.yaml \
              parse \
              -z "${keymap_file}" \
              --virtual-layers Combos \
              > "${yaml_out}"

            python -c \
              "import sys, yaml; \
              path=sys.argv[1]; \
              data=yaml.safe_load(open(path, encoding='utf-8')) or {}; \
              [combo.__setitem__('l', ['Combos']) for combo in (data.get('combos') or [])]; \
              yaml.safe_dump(data, open(path, 'w', encoding='utf-8'), sort_keys=False, allow_unicode=True)" \
              "${yaml_out}"

            if [ -n "${layout_json}" ]; then
              keymap \
                -c keymap-drawer/config.yaml \
                draw \
                -j "${layout_json}" \
                "${yaml_out}" \
                > "${svg_out}"
            else
              keymap \
                -c keymap-drawer/config.yaml \
                draw \
                "${yaml_out}" \
                > "${svg_out}"
            fi

            rendered=$((rendered + 1))
          done

          if [ "${rendered}" -eq 0 ]; then
            echo "No keymaps rendered."
            exit 1
          fi

          ls -la draw-artifacts

      - name: Upload keymap drawings artifact
        uses: actions/upload-artifact@v7
        with:
          name: keymap-drawings
          path: draw-artifacts
          if-no-files-found: error

  keymap-sync:
    name: Update keymap drawings
    needs: keymap-drawer
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          token: ${{ secrets.ZMK_ACTIONS_TOKEN != '' && secrets.ZMK_ACTIONS_TOKEN || github.token }}
          fetch-depth: 0

      - name: Download keymap drawings
        uses: actions/download-artifact@v8
        with:
          name: keymap-drawings
          path: draw-artifacts

      - name: Update drawing files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p keymap-drawer

          # Remove stale outputs for keymaps intentionally excluded
          # from rendering.
          rm -f \
            keymap-drawer/base.svg \
            keymap-drawer/base.yaml \
            keymap-drawer/prospector_scanner.svg \
            keymap-drawer/prospector_scanner.yaml

          shopt -s nullglob

          keymaps=(config/*.keymap)

          for keymap in "${keymaps[@]}"; do
            kb="$(basename "${keymap}" .keymap)"

            if [ "${kb}" = "base" ] || \
               [ "${kb}" = "prospector_scanner" ]; then
              continue
            fi

            for ext in svg yaml; do
              src="$(
                find draw-artifacts \
                  -type f \
                  -name "${kb}.${ext}" \
                  | head -n1 \
                  || true
              )"

              if [ -n "${src}" ]; then
                cp "${src}" "keymap-drawer/${kb}.${ext}"
              fi
            done
          done

          echo "Updated drawing files:"
          ls -la keymap-drawer

      - name: Commit and push changes
        id: commit
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail

          git add -A -- keymap-drawer/

          if git diff --cached --quiet; then
            echo "No keymap drawing changes."

            echo "source_sha=$(git rev-parse HEAD)" \
              >> "$GITHUB_OUTPUT"

            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          # Do not overwrite main if it changed while this pipeline
          # was running.
          git fetch origin "${DEFAULT_BRANCH}"

          remote_sha="$(git rev-parse "origin/${DEFAULT_BRANCH}")"

          if [ "${remote_sha}" != "${SOURCE_SHA}" ]; then
            echo "::error::${DEFAULT_BRANCH} changed while drawing keymaps."
            echo "::error::Expected: ${SOURCE_SHA}"
            echo "::error::Current:  ${remote_sha}"
            exit 1
          fi

          git checkout -B "${DEFAULT_BRANCH}" "${SOURCE_SHA}"

          git commit -m "chore: update keymap drawings"

          git push origin "HEAD:${DEFAULT_BRANCH}"

          echo "source_sha=$(git rev-parse HEAD)" \
            >> "$GITHUB_OUTPUT"

  queue-release:
    name: Queue Firmware Release

    needs:
      - keymap-drawer
      - keymap-sync

    if: ${{ inputs.chain_next == true }}

    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: Trigger Release ZMK Firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.keymap-sync.outputs.source_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_RUN_ID}" ]; then
            echo "::error::Missing build_run_id."
            exit 1
          fi

          if [ -z "${SOURCE_SHA}" ]; then
            echo "::error::Missing source_sha."
            exit 1
          fi

          echo "Source SHA: ${SOURCE_SHA}"
          echo "Build Run ID: ${BUILD_RUN_ID}"

          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${DEFAULT_BRANCH}" \
            --raw-field "source_sha=${SOURCE_SHA}" \
            --raw-field "build_run_id=${BUILD_RUN_ID}"