services:
  zmk-build-stable:
    image: zmkfirmware/zmk-build-arm:4.1
    working_dir: /workspace
    entrypoint:
      - python3
      - scripts/build_runner.py
      - build-many
      - --profile
      - stable
    environment:
      CCACHE_DIR: /tmp/zmk-config/.ccache
      CCACHE_IGNOREOPTIONS: -specs=picolibc.specs
    volumes:
      - .:/workspace
      - ./.build/local/workspace:/tmp/zmk-config
